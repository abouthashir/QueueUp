<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <style>
    .mark { fill: #131311; }
    @media (prefers-color-scheme: dark) {
      .mark { fill: #f3f3f0; }
    }
  </style>
  <mask id="notches">
    <rect width="32" height="32" fill="white" />
    <circle cx="2" cy="16" r="4.5" fill="black" />
    <circle cx="30" cy="16" r="4.5" fill="black" />
  </mask>
  <rect class="mark" x="2" y="6" width="28" height="20" rx="4" mask="url(#notches)" />
</svg>
